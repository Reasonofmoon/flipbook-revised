{{define "login"}}
<!DOCTYPE html>
<html lang="{{if .Lang}}{{.Lang}}{{else}}en{{end}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.T.login_page_title}} - Flipbook</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="/static/css/style.css?v=3">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">READMASTER<span>플립북</span></a>
    </nav>
    <main class="login-wrapper">
        <div class="login-card">
            <h1>{{.T.admin_login}}</h1>
            <p class="subtitle">{{.T.login_subtitle}}</p>
            {{if .Error}}
            <div class="login-error">{{.Error}}</div>
            {{end}}
            <form method="POST" action="/login">
                <div class="form-group">
                    <label for="password">{{.T.password}}</label>
                    <input type="password" id="password" name="password" required autofocus
                        style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;">
                </div>
                <button type="submit" class="btn btn-primary btn-lg">{{.T.sign_in}}</button>
            </form>
        </div>
    </main>
</body>
</html>
{{end}}
